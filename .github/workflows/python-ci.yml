name: Python analysis checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VLM_ENABLED: 'false'
      VLM_EXTERNAL_CALLS_ENABLED: 'false'
      VLM_PROVIDER: disabled
      GEMINI_API_KEY: ''
      TD_GDS_TEST_URI: ''
      TD_GDS_TEST_PASSWORD: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.13.3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.3'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run unit, contract and Track 1 regression tests
        run: python -B -m unittest discover -s tests -p 'test_*.py'
